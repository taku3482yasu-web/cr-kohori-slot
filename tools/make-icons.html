<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アイコン作成 - CRこおりくんの大冒険</title>
    <style>
        body { background: #222; color: #ddd; font-family: sans-serif; padding: 16px; }
        figure { display: inline-block; margin: 0 16px 16px 0; vertical-align: top; }
        canvas { display: block; max-width: 256px; height: auto; image-rendering: pixelated; border: 1px solid #555; }
        a { color: #9fe6ff; }
    </style>
</head>
<body>
    <!--
    =====================================================================
    ホーム画面に追加したときのアイコン (icons/*.png) を作る
    ---------------------------------------------------------------------
    こおりくんのドット絵 (sprites.js の SPRITES.koori) を紺の背景に大きく描く。
    丸や角丸に切り抜かれても欠けないよう、絵は真ん中の 6 割に収める (maskable)。
    使い方: このページをブラウザで開き、各アイコンの「保存」で icons/ に上書きする
    =====================================================================
    -->
    <h1>アイコン作成</h1>
    <div id="icons"></div>
    <script src="../js/sprites.js?v=056d5554"></script>
    <script>
        const ICONS = [
            { file: 'icon-512.png', size: 512 },
            { file: 'icon-192.png', size: 192 },
            { file: 'apple-touch-icon.png', size: 180 }
        ];

        function drawIcon(canvas, size) {
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');
            // 背景: ゲーム画面と同じ紺のグラデーションに、氷色の光
            const bg = ctx.createRadialGradient(size / 2, size * 0.3, 0, size / 2, size * 0.3, size * 0.8);
            bg.addColorStop(0, '#2c4a7a');
            bg.addColorStop(1, '#0d1220');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, size, size);
            const glow = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.36);
            glow.addColorStop(0, 'rgba(159, 230, 255, 0.45)');
            glow.addColorStop(1, 'rgba(159, 230, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, size, size);
            // こおりくん (16x16 ドット。見えている部分は 14x15 ドット)
            const scale = size * 0.6 / 16;
            const x = (size - 16 * scale) / 2;
            const y = (size - 16 * scale) / 2 + scale * 0.5;
            drawSprite(ctx, SPRITES.koori, 'walk1', x, y, scale);
        }

        ICONS.forEach(({ file, size }) => {
            const fig = document.createElement('figure');
            const canvas = document.createElement('canvas');
            canvas.dataset.file = file;
            drawIcon(canvas, size);
            const link = document.createElement('a');
            link.textContent = `保存 (${file})`;
            link.download = file;
            link.href = canvas.toDataURL('image/png');
            const caption = document.createElement('figcaption');
            caption.appendChild(link);
            fig.append(canvas, caption);
            document.getElementById('icons').appendChild(fig);
        });
    </script>
</body>
</html>
